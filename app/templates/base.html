<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Crew Readiness{% endblock %} · Crew Readiness</title>
  <link rel="preload" href="{{ url_for('static', filename='fonts/space-grotesk-latin-wght-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ url_for('static', filename='fonts/jetbrains-mono-latin-wght-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="proto-banner" role="note">
    Prototype · fictional crew · synthetic data · illustrative thresholds · decision support only
  </div>
  <header class="topbar">
    <a class="brand" href="{{ url_for('views.dashboard') }}" aria-label="Crew Readiness, home">
      <!-- the mark is the art in miniature: sessions as lines, one of them rising -->
      <svg width="30" height="22" viewBox="0 0 30 22" fill="none" aria-hidden="true">
        <path d="M0 3H30" stroke="#2C3140" stroke-width="1.5"/>
        <path d="M0 10H30" stroke="#9AA0AA" stroke-width="1.5"/>
        <path d="M0 19H9C12 19 12 6 15 6S18 19 21 19H30" stroke="#FFB800" stroke-width="1.8"/>
      </svg>
      Crew Readiness
    </a>
    <nav aria-label="Primary">
      <a href="{{ url_for('views.dashboard') }}" class="{{ 'active' if active == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('views.monitor') }}" class="{{ 'active' if active == 'monitor' }}">Monitoring</a>
      <a href="{{ url_for('views.attention') }}" class="{{ 'active' if active == 'attention' }}">Attention</a>
      <a href="{{ url_for('views.mission') }}" class="{{ 'active' if active == 'mission' }}">Mission</a>
      <a href="{{ url_for('views.about') }}" class="{{ 'active' if active == 'about' }}">Privacy &amp; limits</a>
    </nav>
  </header>
  {% block body %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
